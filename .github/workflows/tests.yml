name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Tesseract OCR (English + Hindi)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-hin
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Run unit tests (offline, no API keys needed)
        run: python -m pytest -q
